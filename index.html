<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16284f">
<title>Rookie Rocket · Demo</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- logotipo reutilizado (rastro de foguete vermelho) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 40 32">
    <path d="M2 31 L33 1 L38 1 L12 31 Z" fill="#e3262b"/>
    <path d="M14 31 L36 9 L38 12 L21 31 Z" fill="#e3262b" opacity=".85"/>
  </symbol>
</svg>

<div id="game" aria-label="Rookie Rocket 3D"></div>
<div id="world-ui" aria-hidden="true"></div>

<!-- ===== HUD ===== -->
<div class="hud-top-left">
  <div class="chip brand"><svg class="logo"><use href="#logo"/></svg> ROOKIE ROCKET</div>
  <button class="icon-btn" id="btn-map" data-i18n-title="btn_mapa" aria-label="Mapa">🗺️</button>
  <button class="icon-btn" id="btn-helmet" data-i18n-title="btn_capacete" aria-label="Capacete">🪖</button>
  <button class="icon-btn lang-btn" id="btn-lang" data-i18n-title="btn_idioma" aria-label="Idioma">EN</button>
  <button class="icon-btn" id="btn-credits" data-i18n-title="btn_creditos" aria-label="Créditos">ⓘ</button>
</div>

<div class="leaderstats">
  <div class="ls-head"><span data-i18n="ls_nome">Astronauta</span><span data-i18n="ls_expos">Expos</span><span>★</span></div>
  <div class="ls-row"><span id="ls-name">—</span><span id="ls-expo">0/6</span><span id="ls-badges">0</span></div>
</div>

<aside class="missions" id="missions">
  <button class="missions-head" id="missions-toggle" aria-expanded="true"><span><svg class="logo"><use href="#logo"/></svg> <span data-i18n="missoes_titulo">MISSÕES</span></span> <i>▾</i></button>
  <ol id="mission-list"></ol>
</aside>

<div class="zone-banner" id="zone-banner"><small id="zone-sub"></small><strong id="zone-title"></strong></div>

<div class="hint-bar" id="hint-bar">
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span data-i18n="hint_andar"></span></span>
  <span><kbd>␣</kbd> <span data-i18n="hint_pular"></span></span>
  <span><kbd>E</kbd> <span data-i18n="hint_interagir"></span></span>
  <span><kbd>H</kbd> <span data-i18n="hint_capacete"></span></span>
  <span>🖱️ <span data-i18n="hint_camera"></span></span>
</div>

<div class="badge-toast" id="badge-toast" role="status" aria-live="polite">
  <div class="badge-icon"><svg class="logo"><use href="#logo"/></svg></div>
  <div><small data-i18n="conquista"></small><strong id="badge-name"></strong></div>
</div>

<div class="touch-ui" id="touch-ui">
  <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
  <button class="jump-btn" id="jump-btn" aria-label="Jump">⤒</button>
</div>

<!-- ===== Tela inicial (estética do storyboard) ===== -->
<div class="overlay" id="start">
  <div class="start-card">
    <header class="sb-head">
      <div class="sb-title"><svg class="logo"><use href="#logo"/></svg> ROOKIE ROCKET</div>
      <div class="sb-sub"><span></span><b id="sb-tagline">PROGRAMA ESTAGIÁRIO ASTRONAUTA · ROOKIE ASTRONAUT PROGRAM</b><span></span></div>
    </header>

    <section class="step" id="step-lang">
      <h2 class="sb-label">ESCOLHA O IDIOMA · CHOOSE YOUR LANGUAGE</h2>
      <div class="lang-grid">
        <button class="lang-card" data-lang="pt">
          <svg viewBox="0 0 70 50" class="flag"><rect width="70" height="50" fill="#009c3b"/><path d="M35 5 L65 25 L35 45 L5 25Z" fill="#ffdf00"/><circle cx="35" cy="25" r="11" fill="#002776"/><path d="M24 23 Q35 19 46 27" stroke="#fff" stroke-width="2" fill="none"/></svg>
          <b>PORTUGUÊS</b><small>Brasil</small>
        </button>
        <button class="lang-card" data-lang="en">
          <svg viewBox="0 0 70 50" class="flag"><rect width="70" height="50" fill="#fff"/><g fill="#b22234"><rect y="0" width="70" height="3.85"/><rect y="7.7" width="70" height="3.85"/><rect y="15.4" width="70" height="3.85"/><rect y="23.1" width="70" height="3.85"/><rect y="30.8" width="70" height="3.85"/><rect y="38.5" width="70" height="3.85"/><rect y="46.2" width="70" height="3.85"/></g><rect width="30" height="27" fill="#3c3b6e"/><g fill="#fff"><circle cx="6" cy="5" r="1.4"/><circle cx="15" cy="5" r="1.4"/><circle cx="24" cy="5" r="1.4"/><circle cx="10.5" cy="11" r="1.4"/><circle cx="19.5" cy="11" r="1.4"/><circle cx="6" cy="17" r="1.4"/><circle cx="15" cy="17" r="1.4"/><circle cx="24" cy="17" r="1.4"/><circle cx="10.5" cy="23" r="1.4"/><circle cx="19.5" cy="23" r="1.4"/></g></svg>
          <b>ENGLISH</b><small>United States</small>
        </button>
      </div>
    </section>

    <section class="step" id="step-perfil" hidden>
      <h2 class="sb-label" data-i18n="perfil_titulo"></h2>
      <div class="avatar-grid" id="avatar-grid" role="radiogroup"></div>
      <p class="start-text" data-i18n="start_texto"></p>
      <label for="name-input" data-i18n="nome_label"></label>
      <input id="name-input" maxlength="20" autocomplete="given-name" data-i18n-ph="nome_ph">
      <button class="big-btn" id="play-btn" data-i18n="jogar"></button>
      <button class="link-btn" id="back-lang" data-i18n="voltar_idioma"></button>
      <small class="start-note" data-i18n="start_nota"></small>
    </section>
  </div>
</div>

<!-- ===== Card de exposição ===== -->
<dialog id="info">
  <button class="close" data-close data-i18n-label="fechar">✕</button>
  <div class="info-photo"><img id="info-img" alt=""><div class="info-thumbs" id="info-thumbs"></div></div>
  <div class="info-body">
    <span class="tag" id="info-room"></span>
    <h2 id="info-title"></h2>
    <ul id="info-facts"></ul>
    <div class="source" id="info-source"></div>
    <button class="big-btn small" data-close data-i18n="continuar"></button>
  </div>
</dialog>

<!-- ===== Mapa ===== -->
<dialog id="map">
  <button class="close" data-close data-i18n-label="fechar">✕</button>
  <span class="tag" data-i18n="mapa_tag"></span>
  <h2 data-i18n="mapa_titulo"></h2>
  <div class="map-grid">
    <button data-tp="recepcao"><b>01</b> <span data-i18n="tp_recepcao"></span><small data-i18n="tp_recepcao_s"></small></button>
    <button data-tp="museu"><b>02</b> <span data-i18n="tp_museu"></span><small data-i18n="tp_museu_s"></small></button>
    <button data-tp="hangar"><b>03</b> <span data-i18n="tp_hangar"></span><small data-i18n="tp_hangar_s"></small></button>
    <button data-tp="elevador"><b>04</b> <span data-i18n="tp_elevador"></span><small data-i18n="tp_elevador_s"></small></button>
  </div>
  <p class="map-note" data-i18n="mapa_nota"></p>
</dialog>

<!-- ===== Créditos ===== -->
<dialog id="credits">
  <button class="close" data-close data-i18n-label="fechar">✕</button>
  <span class="tag" data-i18n="cr_tag"></span>
  <h2 data-i18n="cr_titulo"></h2>
  <p data-i18n-html="cr_p1"></p>
  <p data-i18n-html="cr_p2"></p>
  <p data-i18n-html="cr_p3"></p>
  <p data-i18n-html="cr_p4"></p>
  <p class="muted" data-i18n="cr_p5"></p>
  <div id="cr-list"></div>
</dialog>

<div id="sr" class="sr-only" aria-live="polite"></div>

<script src="lib/three.min.js"></script>
<script src="dados.js"></script>
<script src="jogo.js"></script>
</body>
</html>
