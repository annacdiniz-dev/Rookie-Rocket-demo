<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16284f">
<title>Rookie Rocket · Demo</title>
<link rel="stylesheet" href="estilo.css?v=6">
</head>
<body class="inicio">

<!-- logotipo: duas faixas vermelhas inclinadas (rastro de foguete) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 100 100">
    <path d="M4 96 L64 22 Q80 8 99 3 L37 96 Z" fill="#e3262b"/>
    <path d="M46 96 L87 34 Q92 24 97 17 L73 96 Z" fill="#e3262b"/>
  </symbol>
</svg>

<div id="game" aria-label="Rookie Rocket 3D"></div>
<div id="world-ui" aria-hidden="true"></div>

<!-- ===== HUD: esquerda = idioma, créditos, álbum · direita = astronauta e missões ===== -->
<div class="hud hud-top-left">
  <button class="hud-btn" id="btn-lang" data-i18n-title="btn_idioma"><span class="ico">🌐</span><b id="btn-lang-txt">EN</b></button>
  <button class="hud-btn so-ico" id="btn-credits" data-i18n-title="btn_creditos"><span class="ico-i">i</span></button>
  <button class="hud-btn so-ico" id="btn-album" data-i18n-title="btn_album"><span class="ico">📖</span></button>
</div>

<div class="zone-banner" id="zone-banner"><small id="zone-sub"></small><strong id="zone-title"></strong></div>

<div class="hud hint-bar" id="hint-bar">
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span data-i18n="hint_andar"></span></span>
  <span><kbd>␣</kbd> <span data-i18n="hint_pular"></span></span>
  <span><kbd>E</kbd> <span data-i18n="hint_interagir"></span></span>
  <span>🖱️ <span data-i18n="hint_camera"></span></span>
</div>

<div class="badge-toast" id="badge-toast" role="status" aria-live="polite">
  <div class="badge-icon"><svg class="logo"><use href="#logo"/></svg></div>
  <div><small data-i18n="conquista"></small><strong id="badge-name"></strong></div>
</div>

<div class="hud touch-ui" id="touch-ui">
  <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
  <button class="jump-btn" id="jump-btn" aria-label="Jump">⤒</button>
</div>

<!-- ===== Fase 1: cabine em primeira pessoa ===== -->
<div id="missao" hidden>
  <div class="m-vermelho" id="m-vermelho"></div>
  <div class="m-visor"></div>
  <div class="m-mira" id="m-mira" aria-hidden="true"></div>
  <div class="m-splash" id="m-splash"><svg class="logo"><use href="#logo"/></svg><small id="m-splash-fase"></small><b id="m-splash-task"></b></div>
  <div class="m-top">
    <div class="m-titulo"><svg class="logo"><use href="#logo"/></svg><div><small id="m-fase"></small><b id="m-task"></b></div></div>
    <div class="m-alerta" id="m-alerta"></div>
    <button class="m-sair" id="m-sair"></button>
  </div>
  <div class="m-alvos"><span id="m-alvos-l"></span><div class="m-luzes" id="m-luzes"><i></i><i></i><i></i><i></i></div><span id="m-tempo-l"></span><b id="m-tempo">0,0 s</b></div>
  <div class="m-baixo"><div class="m-dica" id="m-dica"></div></div>
</div>

<!-- Banner: missão concluída + card da missão real -->
<dialog id="m-fim" class="banner">
  <div class="banner-topo ok" id="mf-topo"><span class="selo" id="mf-selo">✔</span><h2 id="mf-titulo"></h2></div>
  <div class="banner-corpo">
    <div class="m-estrelas" id="m-estrelas" aria-hidden="true"></div>
    <p class="m-estrelas-txt" id="m-estrelas-txt"></p>
    <small class="novo-card" id="mf-novo"></small>
    <div id="mf-card"></div>
    <div class="banner-botoes"><button class="big-btn alt" id="mf-voltar"></button><button class="big-btn" id="mf-proxima"></button></div>
  </div>
</dialog>

<!-- Banner: reembarcar depois de concluir a Fase 1 -->
<dialog id="m-escolha" class="banner pequeno">
  <button class="close" data-close data-i18n-label="fechar">✕</button>
  <div class="banner-topo ok"><span class="selo">✔</span><h2 id="me-titulo"></h2></div>
  <div class="banner-corpo centro">
    <p id="me-txt"></p>
    <div class="m-estrelas" id="me-estrelas" aria-hidden="true"></div>
    <div class="banner-botoes"><button class="big-btn alt" id="me-refazer"></button><button class="big-btn" id="me-proxima"></button></div>
  </div>
</dialog>

<!-- Banner: continuar no Roblox -->
<dialog id="roblox" class="banner pequeno">
  <button class="close" data-close data-i18n-label="fechar">✕</button>
  <div class="banner-topo"><svg class="logo"><use href="#logo"/></svg><h2 id="rb-titulo"></h2></div>
  <div class="banner-corpo centro">
    <p id="rb-texto"></p>
    <a class="big-btn" id="rb-link" target="_blank" rel="noopener noreferrer"></a>
  </div>
</dialog>

<!-- Álbum espacial -->
<dialog id="album" class="banner">
  <button class="close" data-close data-i18n-label="fechar">✕</button>
  <div class="banner-topo"><span class="selo livro">📖</span><div><h2 id="al-titulo"></h2><p id="al-sub"></p></div></div>
  <div class="banner-corpo"><div class="al-grade" id="al-grade"></div></div>
</dialog>

<!-- ===== Tela inicial ===== -->
<div class="overlay" id="start">
  <div class="start-card">
    <header class="sb-head">
      <svg class="sb-logo"><use href="#logo"/></svg>
      <div>
        <div class="sb-title">ROOKIE ROCKET</div>
        <div class="sb-sub" id="sb-tagline">PROGRAMA ESTAGIÁRIO ASTRONAUTA · ROOKIE ASTRONAUT PROGRAM</div>
      </div>
    </header>
    <div class="sb-body">
      <form class="sb-form" id="start-form" novalidate>
        <div class="field">
          <div class="legend" id="lg-idioma">IDIOMA · LANGUAGE</div>
          <div class="opts" role="radiogroup" aria-labelledby="lg-idioma">
            <button type="button" class="opt" data-lang="pt" role="radio" aria-checked="false">
              <span class="check"></span>
              <svg viewBox="0 0 30 20" class="flag"><rect width="30" height="20" fill="#009c3b"/><path d="M15 2 L28 10 L15 18 L2 10Z" fill="#ffdf00"/><circle cx="15" cy="10" r="4.6" fill="#002776"/></svg>
              <span>Português</span>
            </button>
            <button type="button" class="opt" data-lang="en" role="radio" aria-checked="false">
              <span class="check"></span>
              <svg viewBox="0 0 30 20" class="flag"><rect width="30" height="20" fill="#fff"/><g fill="#b22234"><rect width="30" height="1.54"/><rect y="3.08" width="30" height="1.54"/><rect y="6.16" width="30" height="1.54"/><rect y="9.24" width="30" height="1.54"/><rect y="12.32" width="30" height="1.54"/><rect y="15.4" width="30" height="1.54"/><rect y="18.46" width="30" height="1.54"/></g><rect width="13" height="10.8" fill="#3c3b6e"/></svg>
              <span>English</span>
            </button>
          </div>
        </div>
        <div class="rest" id="form-rest">
          <div class="field">
            <label class="legend" for="name-input" data-i18n="nome_titulo">NOME</label>
            <input id="name-input" maxlength="20" autocomplete="given-name" data-i18n-ph="nome_ph">
          </div>
          <div class="field">
            <div class="legend" id="lg-genero" data-i18n="genero_label">PERSONAGEM</div>
            <div class="opts" role="radiogroup" aria-labelledby="lg-genero">
              <button type="button" class="opt" data-g="m" role="radio" aria-checked="false"><span class="check"></span><span data-i18n="fem">Feminino</span></button>
              <button type="button" class="opt" data-g="h" role="radio" aria-checked="false"><span class="check"></span><span data-i18n="masc">Masculino</span></button>
            </div>
          </div>
          <button class="big-btn" id="play-btn" type="submit" data-i18n="jogar">▶ JOGAR</button>
        </div>
        <p class="start-hint" id="start-hint">Escolha um idioma para começar · Choose a language to start</p>
        <p class="start-text" data-i18n="start_texto"></p>
        <small class="start-note" data-i18n="start_nota"></small>
      </form>
    </div>
  </div>
</div>

<!-- ===== Card de exposição (fecha só no ✕) ===== -->
<dialog id="info">
  <button class="close" data-close data-i18n-label="fechar">✕</button>
  <div class="info-photo"><img id="info-img" alt=""><div class="info-thumbs" id="info-thumbs"></div></div>
  <div class="info-body">
    <span class="tag" id="info-room"></span>
    <h2 id="info-title"></h2>
    <ul id="info-facts"></ul>
    <div class="source" id="info-source"></div>
  </div>
</dialog>

<!-- ===== Fontes, créditos e equipe ===== -->
<dialog id="credits">
  <button class="close" data-close data-i18n-label="fechar">✕</button>
  <span class="tag" data-i18n="cr_tag"></span>
  <h2 data-i18n="cr_titulo"></h2>
  <div class="equipe">
    <div class="equipe-titulo"><svg class="logo"><use href="#logo"/></svg><b data-i18n="cr_equipe">EQUIPE</b></div>
    <div class="equipe-nomes" id="cr-equipe"></div>
  </div>
  <p data-i18n-html="cr_p1"></p>
  <p data-i18n-html="cr_p2"></p>
  <p data-i18n-html="cr_p3"></p>
  <p data-i18n-html="cr_p4"></p>
  <p class="muted" data-i18n="cr_p5"></p>
  <div id="cr-list"></div>
</dialog>

<div id="sr" class="sr-only" aria-live="polite"></div>

<script src="lib/three.min.js"></script>
<script src="dados.js?v=6"></script>
<script src="jogo.js?v=6"></script>
</body>
</html>
